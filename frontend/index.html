<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profesor Digital · Chat + Juegos</title>
  <style>
    :root{
      --bg:#0f172a;
      --bg-alt:#111827;
      --panel:#1f2937;
      --panel-alt:#111d32;
      --ink:#f1f5f9;
      --muted:#94a3b8;
      --primary:#38bdf8;
      --primary-strong:#0ea5e9;
      --success:#4ade80;
      --danger:#f87171;
    }
    *{box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    body{margin:0;background:radial-gradient(circle at 20% 20%,rgba(56,189,248,.15),transparent 40%),radial-gradient(circle at 80% 0,rgba(248,113,113,.2),transparent 35%),var(--bg);color:var(--ink);min-height:100vh;padding:24px}
    .layout{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
    .header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between}
    .header h1{margin:0;font-size:30px}
    .header p{margin:6px 0 0;color:var(--muted)}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px}
    .toolbar button{flex:1 1 140px}
    .grid{display:grid;gap:20px}
    @media(min-width:980px){.grid{grid-template-columns:1fr 360px}}
    .card{background:var(--panel);border-radius:20px;padding:24px;box-shadow:0 24px 40px rgba(15,23,42,.35);display:flex;flex-direction:column;min-height:0}
    button{cursor:pointer;border:none;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;transition:all .2s ease}
    .btn{background:var(--primary);color:#031425}
    .btn:hover{background:var(--primary-strong);color:#fff}
    .btn-outline{background:transparent;border:1px solid rgba(148,163,184,.3);color:var(--muted)}
    .btn-outline:hover{color:var(--ink);border-color:var(--ink)}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
    .chip{padding:8px 12px;border-radius:999px;background:rgba(148,163,184,.14);font-size:13px;cursor:pointer}
    .chip:hover{background:rgba(56,189,248,.18);color:var(--ink)}
    .chatlog{flex:1;overflow-y:auto;padding-right:4px;margin-bottom:16px;max-height:55vh}
    .msg{margin-bottom:14px;display:flex;flex-direction:column}
    .msg strong{font-size:13px;color:var(--muted);margin-bottom:4px}
    .bubble{padding:12px 16px;background:var(--panel-alt);border-radius:16px;border:1px solid rgba(148,163,184,.2);font-size:15px;line-height:1.45}
    .msg.me .bubble{background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.3)}
    .msg.game .bubble{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.4)}
    .composer{display:flex;gap:12px}
    .composer input{flex:1;padding:12px 16px;border-radius:14px;border:none;background:var(--panel-alt);color:var(--ink);font-size:15px}
    .badge{padding:4px 10px;border-radius:10px;background:rgba(56,189,248,.15);color:var(--primary);font-size:12px}
    .status-mini{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;font-size:14px;color:var(--muted)}
    .status-mini span{display:flex;align-items:center;gap:6px}
    .note{background:rgba(56,189,248,.08);border-radius:14px;padding:12px;margin-bottom:12px}
    .quiz{display:flex;flex-direction:column;gap:12px}
    .question{border:1px solid rgba(148,163,184,.25);border-radius:14px;padding:12px}
    .question h4{margin:0 0 8px;font-size:15px}
    .choice{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;border:1px solid rgba(148,163,184,.3);background:transparent;color:var(--ink);font-size:14px}
    .choice.sel{border-color:var(--primary);background:rgba(56,189,248,.12)}
    .choice.ok{border-color:var(--success);background:rgba(74,222,128,.18)}
    .choice.bad{border-color:var(--danger);background:rgba(248,113,113,.15)}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{border:1px solid rgba(148,163,184,.25);padding:10px;text-align:center}
    th{background:rgba(148,163,184,.18)}
    .timer{font-weight:700}
  </style>
</head>
<body>
  <div class="layout">
    <div class="header">
      <div>
        <h1>Profesor Digital</h1>
        <p>Practica teoria, quizzes o tablas de verdad. El backend mantiene memoria por <code>trace</code>.</p>
      </div>
      <div class="toolbar">
        <button id="reset-trace" class="btn-outline">Reset hilo</button>
        <button id="open-docs" class="btn">Abrir Swagger</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="chips">
          <div class="chip" data-text="Quiero un quiz de mapas de Karnaugh nivel facil.">Quiz Karnaugh</div>
          <div class="chip" data-text="Necesito una tabla de verdad de XOR y XNOR paso a paso.">Tabla XOR/XNOR</div>
          <div class="chip" data-text="Explicame que es un flip-flop JK en tres frases.">Explicacion breve</div>
        </div>
        <div class="chatlog" id="chatlog"></div>
        <div class="composer">
          <input id="chat-input" placeholder="Escribe tu pregunta..." />
          <button id="send" class="btn">Enviar</button>
        </div>
      </div>

      <div class="card">
        <div class="status-mini">
          <span>Trace: <strong id="trace-label">---</strong></span>
          <span>Modo: <span class="badge" id="mode-badge">...</span></span>
          <span>Store: <span class="badge" id="store-path">...</span></span>
        </div>
        <div class="game-panel" id="game-panel">
          <h3>Juego activo</h3>
          <div id="game-empty" style="color:var(--muted)">Envia una peticion de practica y aqui aparecera el juego.</div>
          <div id="game-host"></div>
          <div style="margin-top:10px;font-size:14px;color:var(--muted)">
            Tiempo: <span class="timer" id="timer">---</span> · Puntuacion: <span id="score">---</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const API_BASE = params.get('api') || 'https://vqllsq2t-8000.uks1.devtunnels.ms/api';
    const endpoints = {
      chat: `${API_BASE}/chat`,
      reset: `${API_BASE}/reset`,
      health: `${API_BASE}/health`
    };
    const TRACE_KEY = 'prof-digital-trace';

    const $ = (sel) => document.querySelector(sel);
    const chatlog = $('#chatlog');
    let typingRow = null;
    let timerId = null;
    let seconds = 0;

    function getTrace(){ return localStorage.getItem(TRACE_KEY); }
    function setTrace(v){ localStorage.setItem(TRACE_KEY, v); updateTraceLabel(); }
    function clearTrace(){ localStorage.removeItem(TRACE_KEY); updateTraceLabel(); }
    function updateTraceLabel(){
      const trace = getTrace();
      $('#trace-label').textContent = trace ? `${trace.slice(0,8)}…` : '---';
    }

    function addMessage(role, text){
      const row = document.createElement('div');
      row.className = `msg ${role === 'user' ? 'me' : role === 'game' ? 'game' : ''}`;
      const author = document.createElement('strong');
      author.textContent = role === 'user' ? 'Tu' : role === 'game' ? 'Profesor · Juego' : 'Profesor';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      row.appendChild(author);
      row.appendChild(bubble);
      chatlog.appendChild(row);
      chatlog.scrollTop = chatlog.scrollHeight;
    }

    function showTyping(){
      if(typingRow) return;
      typingRow = document.createElement('div');
      typingRow.className='msg';
      typingRow.innerHTML='<strong>Profesor</strong><div class="bubble">Escribiendo...</div>';
      chatlog.appendChild(typingRow);
      chatlog.scrollTop = chatlog.scrollHeight;
    }
    function hideTyping(){
      if(typingRow){
        typingRow.remove();
        typingRow = null;
      }
    }

    function resetGamePanel(){
      $('#game-host').innerHTML='';
      $('#game-empty').style.display='block';
      $('#score').textContent='---';
      $('#timer').textContent='---';
      if(timerId){ clearInterval(timerId); timerId=null; }
    }

    function startTimer(){
      if(timerId){ clearInterval(timerId); }
      seconds = 0;
      $('#timer').textContent='0s';
      timerId = setInterval(()=>{
        seconds++;
        $('#timer').textContent = `${seconds}s`;
      },1000);
    }

    function renderGame(spec){
      if(!spec){ resetGamePanel(); return; }
      $('#game-empty').style.display='none';
      const host = $('#game-host');
      host.innerHTML='';
      const title = document.createElement('div');
      title.innerHTML = `<strong>${spec.title}</strong> · ${spec.topic} (${spec.difficulty})`;
      host.appendChild(title);
      const note = document.createElement('div');
      note.className='note';
      note.textContent = `Nota del profesor: ${spec.professor_note}`;
      host.appendChild(note);
      if(spec.type === 'quiz'){ renderQuiz(host, spec); }
      else if(spec.type === 'truth_table'){ renderTruth(host, spec); }
    }

    function renderQuiz(host, spec){
      const wrap = document.createElement('div');
      wrap.className='quiz';
      const answers = {};
      let submitted=false;
      spec.payload.questions.forEach((q,idx)=>{
        const block=document.createElement('div');
        block.className='question';
        block.innerHTML=`<h4>Q${idx+1}. ${q.prompt}</h4>`;
        q.choices.forEach((choice,i)=>{
          const btn=document.createElement('button');
          btn.className='choice';
          btn.textContent=choice;
          btn.addEventListener('click',()=>{
            if(submitted) return;
            answers[q.id]=i;
            block.querySelectorAll('.choice').forEach(el=>el.classList.remove('sel'));
            btn.classList.add('sel');
          });
          block.appendChild(btn);
        });
        const exp=document.createElement('div');
        exp.style.marginTop='8px';
        exp.style.display='none';
        exp.style.color='var(--muted)';
        exp.textContent=`Explicacion: ${q.explanation}`;
        block.appendChild(exp);
        wrap.appendChild(block);
      });
      const action=document.createElement('button');
      action.className='btn';
      action.style.marginTop='10px';
      action.textContent='Corregir';
      action.addEventListener('click',()=>{
        if(submitted) return;
        submitted=true;
        let ok=0;
        wrap.querySelectorAll('.question').forEach((block,idx)=>{
          const q=spec.payload.questions[idx];
          block.querySelectorAll('.choice').forEach((btn,i)=>{
            btn.classList.remove('sel');
            if(i===q.correctIndex) btn.classList.add('ok');
            if(answers[q.id]===i && i!==q.correctIndex) btn.classList.add('bad');
          });
          if(answers[q.id]===q.correctIndex) ok++;
          block.lastChild.style.display='block';
        });
        $('#score').textContent=`${ok}/${spec.payload.questions.length}`;
        if(timerId){ clearInterval(timerId); timerId=null; }
      });
      host.appendChild(wrap);
      host.appendChild(action);
      startTimer();
    }

    function renderTruth(host,spec){
      const wrap=document.createElement('div');
      const table=document.createElement('table');
      const thead=document.createElement('thead');
      const thr=document.createElement('tr');
      spec.payload.headers.forEach(h=>{
        const th=document.createElement('th');
        th.textContent=h;
        thr.appendChild(th);
      });
      thead.appendChild(thr);
      const tbody=document.createElement('tbody');
      const entries=spec.payload.rows.map(r=>({A:r.A,B:r.B,F:''}));
      entries.forEach((row,i)=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${row.A}</td><td>${row.B}</td>`;
        const td=document.createElement('td');
        const input=document.createElement('input');
        input.type='text';
        input.maxLength=1;
        input.style.width='50px';
        input.style.textAlign='center';
        input.addEventListener('input',e=>{
          const v=e.target.value.trim();
          row.F = v === '0' || v === '1' ? v : '';
        });
        td.appendChild(input);
        tr.appendChild(td);
        tbody.appendChild(tr);
      });
      table.appendChild(thead);
      table.appendChild(tbody);
      wrap.appendChild(table);
      const button=document.createElement('button');
      button.className='btn';
      button.style.marginTop='10px';
      button.textContent='Verificar';
      button.addEventListener('click',()=>{
        let ok=0;
        [...tbody.querySelectorAll('tr')].forEach((tr,i)=>{
          const input=tr.querySelector('input');
          input.disabled=true;
          const expected=String(spec.payload.solution[i].F);
          if(entries[i].F === expected){
            tr.style.background='rgba(74,222,128,.2)';
            ok++;
          }else{
            tr.style.background='rgba(248,113,113,.2)';
          }
        });
        $('#score').textContent=`${ok}/${spec.payload.rows.length}`;
        if(timerId){ clearInterval(timerId); timerId=null; }
      });
      host.appendChild(wrap);
      host.appendChild(button);
      startTimer();
    }

    async function fetchHealth(){
      try{
        const res = await fetch(endpoints.health);
        const data = await res.json();
        $('#mode-badge').textContent=data.mode || 'unknown';
        $('#store-path').textContent=data.store_path || 'store.json';
      }catch(err){
        $('#mode-badge').textContent='offline';
        console.error(err);
      }
    }

    async function submitMessage(text){
      if(!text.trim()) return;
      addMessage('user', text);
      showTyping();
      try{
        const payload = {
          trace: getTrace(),
          messages:[{role:'user', content:text}]
        };
        const res = await fetch(endpoints.chat, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(payload)
        });
        if(!res.ok){
          throw new Error(`HTTP ${res.status}`);
        }
        const data = await res.json();
        if(data.trace){ setTrace(data.trace); }
        if(data.kind === 'assistant'){
          addMessage('assistant', data.content || '');
          resetGamePanel();
        }else if(data.kind === 'game_spec'){
          addMessage('game', `Te he preparado un juego: ${data.spec?.title || ''}`);
          renderGame(data.spec);
        }
      }catch(err){
        console.error(err);
        addMessage('assistant', `Error: ${err.message || err}`);
      }finally{
        hideTyping();
      }
    }

    async function resetTrace(){
      try{
        const trace = getTrace();
        clearTrace();
        resetGamePanel();
        chatlog.innerHTML='';
        addMessage('assistant','Hilo reiniciado. Se comenzará una nueva conversación en el próximo mensaje.');
        if(trace){
          await fetch(endpoints.reset, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({ trace })
          }).catch(()=>{});
        }else{
          await fetch(endpoints.reset, { method:'POST' }).catch(()=>{});
        }
      }catch(err){
        console.error(err);
      }
    }

    $('#send').addEventListener('click', ()=>{
      const input=$('#chat-input');
      const text=input.value;
      input.value='';
      submitMessage(text);
    });
    $('#chat-input').addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){
        e.preventDefault();
        $('#send').click();
      }
    });
    document.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const text=chip.dataset.text || '';
        $('#chat-input').value='';
        submitMessage(text);
      });
    });
    $('#reset-trace').addEventListener('click', ()=>{
      resetTrace();
      clearTrace();
      updateTraceLabel();
    });
    $('#open-docs').addEventListener('click', ()=>{
      const base = API_BASE.replace(/\/api$/, '');
      window.open(`${base}/swagger`, '_blank');
    });

    updateTraceLabel();
    fetchHealth();
    addMessage('assistant','Hola! Soy tu profesor digital. Pideme teoria o dime que quieres practicar.');
  </script>
</body>
</html>
